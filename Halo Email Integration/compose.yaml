services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haloaddin
      POSTGRES_PASSWORD: haloaddin_local
      POSTGRES_USER: haloaddin
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haloaddin -d haloaddin"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - halo-postgres-data:/var/lib/postgresql/data

volumes:
  halo-postgres-data:
